# Builds the Windows installer and publishes it as a release whenever a version tag (v2.0.1, v2.1.0, ...) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install NSIS (builds the installer)
        run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run dist:win
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Windows:** download `DeepScrape-Setup-${VERSION}.exe` below and run it. It installs for your Windows account only (no administrator rights) and does not need Node.js.

          The installer is not code-signed, so Windows may show "Windows protected your PC" the first time: choose **More info**, then **Run anyway**.

          Scrapes are saved in `Documents\DeepScrape\data` and are kept when you update or uninstall.
          NOTES
          sed -i "s/\${VERSION}/${GITHUB_REF_NAME#v}/" notes.md
          gh release create "$GITHUB_REF_NAME" dist/DeepScrape-Setup-*.exe --title "DeepScrape ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
